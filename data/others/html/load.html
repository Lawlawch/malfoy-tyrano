<div id="menu_load_wrapper" class="vn_sys">
    <div class="vn_sys_panel">
        <div class="vn_sys_head">
            <span class="vn_sys_title">讀　檔</span>
            <span class="menu_item"><span class="menu_close vn_close_btn">返　回</span></span>
        </div>

        <!-- 存檔列表（JsRender 語法） -->
        <div class="area_save_list">
            <ul class="save_list">
                {{for array_save}}
                <li class="save_display_area save_list_item" data-num="{{>num}}">
                    <span class="vn_slot_no">No.{{:num+1}}</span>
                    <span class="save_list_item_thumb">
                        {{if img_data != ""}}
                        <img src="{{>img_data}}" />
                        {{/if}}
                    </span>
                    <span class="save_list_item_area">
                        <span class="save_list_item_date">{{:save_date}}</span>
                        <span class="save_list_item_text">{{:title}}</span>
                    </span>
                </li>
                {{/for}}
            </ul>
        </div>

        <!-- 觸控裝置的捲動按鈕 -->
        <div class="vn_sys_foot button_smart">
            <span class="vn_arrow button_arrow_up">▲</span>
            <span class="vn_arrow button_arrow_down">▼</span>
        </div>
    </div>
</div>
